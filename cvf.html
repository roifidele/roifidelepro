<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#0B2545" />

  <!-- Open Graph -->

  <!-- Fonts -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-blue': '#0B2545',
            'brand-blue-light': '#13315C',
            'brand-blue-soft': '#1E3A5F',
            'brand-green': '#1B7F5C',
            'brand-green-light': '#2E9E77',
            'brand-green-dark': '#136245',
            'brand-cream': '#F7FAF8',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    section[id] { scroll-margin-top: 5rem; }

    /* Reveal animation */
    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease-out, transform .7s ease-out; will-change: opacity, transform; }
    .reveal.is-visible { opacity: 1; transform: none; }

    /* Hero overlay */
    .hero-overlay {
      background: linear-gradient(120deg, rgba(11,37,69,0.88) 0%, rgba(11,37,69,0.7) 45%, rgba(27,127,92,0.55) 100%);
    }
    .hero-overlay-soft {
      background: linear-gradient(180deg, rgba(11,37,69,0.55) 0%, rgba(11,37,69,0.35) 60%, rgba(11,37,69,0.6) 100%);
    }

    /* Focus visible */
    :focus-visible { outline: 3px solid #2E9E77; outline-offset: 3px; border-radius: 4px; }

    /* Mobile menu transition */
    .fade-enter-active, .fade-leave-active { transition: opacity .2s ease, transform .2s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(-6px); }

    /* Skip link */
    .skip-link {
      position: absolute; top: -100px; left: 16px; z-index: 100;
      background: #1B7F5C; color: #fff; padding: 12px 18px; border-radius: 8px;
      font-weight: 600; transition: top .2s;
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
      * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }

    .placeholder-info { color: #94A3B8; font-style: italic; }

</head>
<body class="bg-white text-gray-800 antialiased">
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <div id="app"></div>

  <script>
    const { createApp, ref, reactive, onMounted, onUnmounted } = Vue;

    /* =========================================================
       REUSABLE COMPONENT : SectionHeading
       ========================================================= */
    const SectionHeading = {
      name: 'SectionHeading',
      props: {
        eyebrow: String,
        title: { type: String, required: true },
        subtitle: String,
        light: { type: Boolean, default: false },
        align: { type: String, default: 'center' }, // 'center' | 'left'
      },
      template: `
        <div :class="align === 'center' ? 'max-w-3xl mx-auto text-center' : 'max-w-3xl'"
             class="mb-12 md:mb-16">
          <span v-if="eyebrow"
                class="inline-block text-xs sm:text-sm font-semibold uppercase tracking-[0.18em] mb-3"
                :class="light ? 'text-emerald-300' : 'text-brand-green'">
            {{ eyebrow }}
          </span>
          <h2 class="font-serif text-3xl md:text-4xl lg:text-5xl font-semibold leading-tight mb-4"
              :class="light ? 'text-white' : 'text-brand-blue'">
            {{ title }}
          </h2>
          <p v-if="subtitle" class="text-base md:text-lg leading-relaxed"
             :class="light ? 'text-blue-100/90' : 'text-gray-600'">
            {{ subtitle }}
          </p>
        </div>
      `,
    };

    /* =========================================================
       REUSABLE COMPONENT : IconBox (icons + label card)
       ========================================================= */
    const IconBox = {
      name: 'IconBox',
      props: {
        title: { type: String, required: true },
        text: String,
        icon: { type: String, default: 'leaf' },
        tone: { type: String, default: 'green' }, // green | blue
      },
      setup() {
        // Inline SVG paths (Lucide-inspired, stroke-based)
        const icons = {
          store: `<path d="M3 9l1-5h16l1 5"/><path d="M4 9v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M9 21v-6h6v6"/>`,
          heart: `<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>`,
          cap: `<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.7 3 3 6 3s6-1.3 6-3v-5"/>`,
          shield: `<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>`,
          coins: `<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="M16.71 13.88l.7.71-2.82 2.82"/>`,
          globe: `<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>`,
          leaf: `<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8a7 7 0 0 1-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/>`,
          users: `<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`,
        };
        return { icons };
      },
      template: `
        <article class="group h-full p-6 md:p-7 bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-300">
          <div class="w-12 h-12 rounded-xl flex items-center justify-center mb-4 transition-colors"
               :class="tone === 'blue' ? 'bg-brand-blue/5 text-brand-blue group-hover:bg-brand-blue group-hover:text-white'
                                        : 'bg-brand-green/10 text-brand-green group-hover:bg-brand-green group-hover:text-white'">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" v-html="icons[icon] || icons.leaf"></svg>
          </div>
          <h3 class="font-serif text-lg font-semibold text-brand-blue mb-2">{{ title }}</h3>
          <p v-if="text" class="text-sm text-gray-600 leading-relaxed">{{ text }}</p>
        </article>
      `,
    };

       SITE HEADER
       ========================================================= */

      name: 'SiteHeader',
      setup() {

        const scrolled = ref(false);
        const onScroll = () => { scrolled.value = window.scrollY > 24; };
        onMounted(() => window.addEventListener('scroll', onScroll, { passive: true }));
        onUnmounted(() => window.removeEventListener('scroll', onScroll));

        const links = [
          { label: 'Accueil', href: '#accueil' },
          { label: 'À propos', href: '#apropos' },
          { label: 'Missions', href: '#missions' },
          { label: 'Bénéficiaires', href: '#beneficiaires' },
          { label: 'Microcrédit', href: '#microcredit' },
          { label: 'Vision', href: '#vision' },
          { label: 'Partenaires', href: '#partenaires' },
        ];
        const closeMenu = () => { open.value = false; };
        return { open, scrolled, links, closeMenu };
      },
      template: `
        <header class="fixed top-0 inset-x-0 z-50 transition-all duration-300"

          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                  <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                       :class="scrolled ? 'text-brand-green' : 'text-emerald-200'" aria-hidden="true">
                    <path d="M12 22V12"/>
                    <path d="M12 12c-3.5 0-6-2-6-6 3.5 0 6 2 6 6z"/>
                    <path d="M12 16c3.5 0 6-2 6-6-3.5 0-6 2-6 6z"/>
                  </svg>
                </span>
                <span class="leading-tight">
                  <span class="block font-serif text-base sm:text-lg font-semibold transition"
                        :class="scrolled ? 'text-brand-blue' : 'text-white'">
                    CONGO VIC-FEZENSAC
                  </span>
                  <span class="block text-[10px] sm:text-[11px] uppercase tracking-[0.15em] transition"
                        :class="scrolled ? 'text-brand-green' : 'text-emerald-200'">
                    Solidarité &amp; Entrepreneuriat
                  </span>

              </a>

              <nav class="hidden lg:flex items-center gap-1" aria-label="Navigation principale">

                   :class="scrolled ? 'text-gray-700 hover:text-brand-green hover:bg-brand-green/5'
                                   : 'text-white/90 hover:text-white hover:bg-white/10'">

                </a>
                <a href="#contact"

                   :class="scrolled ? 'bg-brand-green text-white hover:bg-brand-green-light'
                                   : 'bg-white text-brand-blue hover:bg-emerald-50'">

                </a>
              </nav>

              <button type="button" @click="open = !open"
                      class="lg:hidden inline-flex items-center justify-center p-2 rounded-lg transition-colors"
                      :class="scrolled ? 'text-brand-blue hover:bg-gray-100' : 'text-white hover:bg-white/10'"
                      :aria-expanded="open" aria-controls="mobile-menu"
                      :aria-label="open ? 'Fermer le menu' : 'Ouvrir le menu'">
                <svg v-if="!open" class="w-6 h-6" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                  <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <svg v-else class="w-6 h-6" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                  <path d="M6 6l12 12M6 18L18 6"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Mobile menu panel -->
          <transition name="fade">
            <div v-if="open" id="mobile-menu" class="lg:hidden bg-white border-t border-gray-100 shadow-lg">
              <nav class="px-4 pt-3 pb-5 space-y-1" aria-label="Navigation mobile">
                <a v-for="link in links" :key="link.href" :href="link.href" @click="closeMenu"
                   class="block px-3 py-2.5 text-base font-medium text-gray-700 rounded-lg hover:bg-brand-green/10 hover:text-brand-green transition-colors">
                  {{ link.label }}
                </a>
                <a href="#contact" @click="closeMenu"
                   class="block mt-2 px-3 py-3 text-center text-white bg-brand-green rounded-lg font-semibold hover:bg-brand-green-light transition-colors">
                  Nous contacter
                </a>
              </nav>
            </div>
          </transition>
        </header>
      `,
    };

    /* =========================================================
       HERO SECTION
       ========================================================= */
    const HeroSection = {
      name: 'HeroSection',
      template: `
        <section id="accueil" class="relative min-h-screen flex items-center overflow-hidden">
          <!-- Background image -->
          <div class="absolute inset-0">
            <img
              src="https://images.unsplash.com/photo-1594608661623-aa0bd3a69d98?auto=format&fit=crop&w=1920&q=80"
              alt=""
              class="w-full h-full object-cover"
              loading="eager"
              fetchpriority="high" />
            <div class="absolute inset-0 hero-overlay"></div>
            <div class="absolute inset-0 hero-overlay-soft"></div>
          </div>

          <!-- Content -->
          <div class="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-24 text-center">
            <p class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 backdrop-blur-sm border border-white/25 text-emerald-200 text-[11px] sm:text-xs font-semibold uppercase tracking-[0.15em] mb-6">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 animate-pulse"></span>
              Organisation créée en juillet 2025
            </p>

            <h1 class="font-serif text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-semibold text-white leading-[1.05] mb-6">
              Ensemble, construisons<br class="hidden sm:block" />

            </h1>

            <p class="max-w-2xl mx-auto text-base sm:text-lg md:text-xl text-blue-50/95 leading-relaxed mb-10">
              CONGO VIC-FEZENSAC soutient les auto-entrepreneurs, les familles en difficulté,
              les jeunes défavorisés et les personnes vulnérables pour les aider à développer
              leurs activités et améliorer leurs conditions de vie.
            </p>

            <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 justify-center items-stretch sm:items-center">
              <a href="#apropos"
                 class="inline-flex items-center justify-center gap-2 px-7 py-3.5 rounded-full bg-brand-green text-white font-semibold shadow-lg hover:bg-brand-green-light transition-colors">
                Découvrir notre mission
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
              </a>
              <a href="#partenaires"
                 class="inline-flex items-center justify-center gap-2 px-7 py-3.5 rounded-full bg-white/10 backdrop-blur-sm border border-white/40 text-white font-semibold hover:bg-white/20 transition-colors">
                Devenir partenaire
              </a>
            </div>
          </div>

          <!-- Subtle scroll cue -->
          <div class="absolute bottom-6 left-1/2 -translate-x-1/2 hidden sm:flex flex-col items-center gap-2 text-white/70 text-[10px] uppercase tracking-[0.2em]">
            <span>Découvrir</span>
            <svg class="w-4 h-4 animate-bounce" viewBox="0 0 24 24" fill="none"

              <path d="M6 9l6 6 6-6"/>
            </svg>
          </div>
        </section>
      `,
    };

    /* =========================================================
       ABOUT SECTION
       ========================================================= */
    const AboutSection = {
      name: 'AboutSection',
      components: { SectionHeading },
      template: `
        <section id="apropos" class="py-20 md:py-28 bg-brand-cream">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid lg:grid-cols-2 gap-12 lg:gap-16 items-center">
              <!-- Image -->
              <div v-reveal class="relative order-2 lg:order-1">
                <div class="relative rounded-2xl overflow-hidden shadow-xl">
                  <img
                    src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1000&q=80"
                    alt="Mains unies en cercle, symbole de solidarité et d'entraide communautaire"
                    class="w-full h-[420px] object-cover"
                    loading="lazy" />
                </div>
                <!-- Accent card -->
                <div class="absolute -bottom-6 -right-2 sm:-right-6 bg-white rounded-xl shadow-lg p-5 max-w-[220px] border border-gray-100">
                  <p class="text-[11px] font-semibold uppercase tracking-wider text-brand-green mb-1">Depuis</p>
                  <p class="font-serif text-2xl font-semibold text-brand-blue">Juillet 2025</p>
                  <p class="text-xs text-gray-500 mt-1 leading-snug">Une initiative née de la solidarité</p>
                </div>
              </div>

              <!-- Text -->
              <div v-reveal class="order-1 lg:order-2">
                <span class="inline-block text-xs sm:text-sm font-semibold uppercase tracking-[0.18em] text-brand-green mb-3">
                  Qui sommes-nous
                </span>
                <h2 class="font-serif text-3xl md:text-4xl lg:text-5xl font-semibold text-brand-blue leading-tight mb-5">
                  Une organisation au service des plus vulnérables
                </h2>
                <p class="text-gray-600 leading-relaxed mb-4">
                  <strong class="text-brand-blue">CONGO VIC-FEZENSAC</strong> est une organisation
                  créée en <strong class="text-brand-blue">juillet 2025</strong>, portée par la conviction
                  que chaque personne mérite les moyens de bâtir sa propre autonomie.
                </p>
                <p class="text-gray-600 leading-relaxed mb-4">
                  Notre mission est de soutenir les auto-entrepreneurs, les familles en difficulté,
                  les jeunes défavorisés et les personnes vulnérables, afin de les aider à développer
                  leurs activités et à améliorer durablement leurs conditions de vie.
                </p>
                <p class="text-gray-600 leading-relaxed mb-8">

                  accompagnement doit renforcer la dignité, la confiance et l'indépendance
                  de celles et ceux que nous soutenons.
                </p>

                <ul class="space-y-3">
                  <li v-for="item in ['Accompagnement personnalisé', 'Approche communautaire et solidaire', 'Promotion de l\'autonomie financière']"

    /* =========================================================
       MISSIONS SECTION
       ========================================================= */
    const MissionsSection = {
      name: 'MissionsSection',
      components: { SectionHeading, IconBox },
      setup() {
        const missions = [
          {
            icon: 'store',
            tone: 'green',
            title: 'Soutenir les auto-entrepreneurs',
            text: "Accompagner les porteurs de projets et les petites activités génératrices de revenus dans leur développement.",
          },
          {
            icon: 'heart',
            tone: 'blue',
            title: 'Accompagner les familles',
            text: "Apporter un soutien concret aux familles en difficulté pour améliorer leurs conditions de vie.",
          },
          {
            icon: 'cap',
            tone: 'green',
            title: 'Épauler les jeunes défavorisés',
            text: "Offrir aux jeunes des perspectives, de l'encouragement et des ressources pour construire leur avenir.",
          },
          {
            icon: 'shield',
            tone: 'blue',
            title: 'Protéger les personnes vulnérables',
            text: "Veiller à la dignité et au bien-être des personnes les plus fragiles, sans jugement.",

      },
      template: `
        <section id="missions" class="py-20 md:py-28 bg-white">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                <div class="absolute inset-0 bg-gradient-to-t from-brand-blue/60 via-transparent to-transparent"></div>
              </div>

                <p class="text-sm font-semibold text-white uppercase tracking-wider mb-4">Notre engagement</p>
                <p class="font-serif text-xl text-white leading-snug mb-4">
                  « Ensemble, construisons un avenir meilleur »
                </p>
                <p class="text-sm leading-relaxed">
                  Chaque action compte. Chaque sourire compte. Chaque pas vers l'autonomie compte.
                </p>
              </div>
            </div>

            <div class="mt-12 pt-6 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-blue-200/70">
              <p>&copy; 2025 CONGO VIC-FEZENSAC — Tous droits réservés.</p>
              <p class="italic">Site en cours de validation — informations à compléter.</p>
            </div>
          </div>
        </footer>
      `,
    };

    /* =========================================================
       ROOT APP
       ========================================================= */
    const app = createApp({
      components: {
        SiteHeader,
        HeroSection,
        AboutSection,
        MissionsSection,
        BeneficiariesSection,
        MicrocreditSection,
        VisionSection,
        PartnersSection,
        ContactSection,
        SiteFooter,
      },
      template: `
        <div>
          <SiteHeader />
          <main id="main-content">
            <HeroSection />
            <AboutSection />
            <MissionsSection />
            <BeneficiariesSection />
            <MicrocreditSection />
            <VisionSection />
            <PartnersSection />
            <ContactSection />
          </main>
          <SiteFooter />
        </div>
      `,
    });

    /* Reveal directive — IntersectionObserver */
    app.directive('reveal', {
      mounted(el, binding) {
        el.classList.add('reveal');
        const delay = binding.value && binding.value.delay;
        if (delay) el.style.transitionDelay = delay + 'ms';

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                el.classList.add('is-visible');
                observer.unobserve(el);
              }
            });
          },
          { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
        );
        observer.observe(el);
      },
    });

    app.mount('#app');
  </script>
